<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Di — Admin dashboard</title>

    <link rel="stylesheet" href="admin.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- LOGIN -->
    <main id="loginScreen" class="login-screen">
      <div class="login-card">
        <div class="login-icon">🔐</div>
        <h1>Admin access</h1>
        <p>Enter the admin key to continue.</p>

        <form id="loginForm">
          <input
            id="adminKeyInput"
            type="password"
            placeholder="Admin key"
            autocomplete="current-password"
            required
          />
          <button id="loginButton" type="submit">Login</button>
        </form>

        <p id="loginError" class="login-error" role="alert"></p>
      </div>
    </main>

    <!-- ADMIN DASHBOARD -->
    <main class="wrap hidden" id="dashboard">
      <div class="page-heading">
        <h1>Di — Admin dashboard</h1>
        <button id="changeAdminKey" type="button" class="secondary-btn">Change key</button>
      </div>

      <p id="adminStatus" class="admin-status" role="status"></p>

      <!-- REQUESTS -->
      <section class="card">
        <h2>Student requests</h2>

        <div class="form-row">
          <input id="reqStudent" placeholder="Student name / id" />

          <select id="reqType">
            <option value="Reschedule">Reschedule</option>
            <option value="Cancel">Cancel</option>
          </select>

          <input id="reqDate" type="date" />
          <input id="reqComment" placeholder="Comment (optional)" />
          <button id="addRequest" type="button">Add</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Student</th>
                <th>Type</th>
                <th>Requested date</th>
                <th>Message</th>
                <th>Created</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="requestsTable"></tbody>
          </table>
        </div>
      </section>

      <!-- REPLY -->
      <section class="card">
        <h2>Reply to a student</h2>

        <div class="form-row">
          <input id="replyStudent" placeholder="Student id" />
          <textarea
            id="replyMessage"
            placeholder="Your message to the student"
            rows="3"
          ></textarea>
          <button id="sendReply" type="button">Send reply</button>
        </div>
      </section>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
